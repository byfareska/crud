# The optional dependencies of the bundle (Doctrine, Symfony Security, Symfony UX Autocomplete, Flysystem) are used only by
# their integrations, which CrudBundle registers when the package is there. The rest of the bundle must work without
# them.
deptrac:
    paths:
        - ./src

    layers:
        -
            name: Doctrine
            collectors:
                -
                    type: classNameRegex
                    value: '#^Doctrine\\#'
        -
            name: SymfonySecurity
            collectors:
                -
                    type: classNameRegex
                    value: '#^Symfony\\(Bundle\\SecurityBundle|Component\\Security)\\#'
        -
            name: UxAutocomplete
            collectors:
                -
                    type: classNameRegex
                    value: '#^Symfony\\UX\\Autocomplete\\#'
        -
            name: Flysystem
            collectors:
                -
                    type: classNameRegex
                    value: '#^League\\Flysystem\\#'
        -
            name: DoctrineIntegration
            collectors:
                -
                    type: directory
                    value: src/Driver/Doctrine/.*
                -
                    type: directory
                    value: src/Chart/Sql/.*
                -
                    type: directory
                    value: src/Files/Doctrine/.*
                -
                    type: classNameRegex
                    value: '#^Byfareska\\Crud\\Dashboard\\Storage\\(DoctrineDashboardLayouts|DashboardLayoutRecord)$#'
        -
            name: SecurityIntegration
            collectors:
                -
                    type: classNameRegex
                    value: '#^Byfareska\\Crud\\Security\\(SecurityActor|SecurityPanelAccount|UserIdMapper|DefaultUserIdMapper)$#'
        -
            name: AutocompleteIntegration
            collectors:
                -
                    type: directory
                    value: src/Autocomplete/.*
        -
            name: FlysystemIntegration
            collectors:
                -
                    type: directory
                    value: src/Files/Flysystem/.*
        -
            # Registers the integrations when their packages are there.
            name: Wiring
            collectors:
                -
                    type: classNameRegex
                    value: '#^Byfareska\\Crud\\CrudBundle$#'
        -
            name: Bundle
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: classNameRegex
                            value: '#^Byfareska\\Crud\\#'
                    must_not:
                        -
                            type: layer
                            value: DoctrineIntegration
                        -
                            type: layer
                            value: SecurityIntegration
                        -
                            type: layer
                            value: AutocompleteIntegration
                        -
                            type: layer
                            value: FlysystemIntegration
                        -
                            type: layer
                            value: Wiring

    ruleset:
        Bundle:
        DoctrineIntegration:
            - Bundle
            - Doctrine
        SecurityIntegration:
            - Bundle
            - SymfonySecurity
        # Searches entities: also Doctrine's. isGranted() names Security, never called without it.
        AutocompleteIntegration:
            - Bundle
            - DoctrineIntegration
            - Doctrine
            - UxAutocomplete
            - SymfonySecurity
        FlysystemIntegration:
            - Bundle
            - Flysystem
        Wiring:
            - Bundle
            - DoctrineIntegration
            - SecurityIntegration
            - AutocompleteIntegration
            - FlysystemIntegration
            - Doctrine
            - SymfonySecurity
            - UxAutocomplete
            - Flysystem
